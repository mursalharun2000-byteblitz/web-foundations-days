<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Live Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <button id="theme-toggle">Dark mode</button>

    <main>
        <label for="note-text">Write your draft:</label>
        <textarea id="note-text" placeholder="Start typing here..."></textarea>
        
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
        
        <button id="clear-btn">Clear</button>
    </main>
</body>
</html>
